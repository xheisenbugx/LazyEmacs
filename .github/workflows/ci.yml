name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Syntax and startup contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: "31.1"
      - name: Install Emacs 31.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftpmirror.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip -OutFile emacs.zip
          Expand-Archive emacs.zip -DestinationPath "$env:RUNNER_TEMP\emacs"
          $emacs = Get-ChildItem "$env:RUNNER_TEMP\emacs" -Recurse -Filter emacs.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $emacs.DirectoryName
          # Git's MSYS gpg cannot verify ELPA signatures from native Emacs.
          choco install gnupg -y --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\GnuPG\bin"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test.py --offline-only

  integration:
    name: Bootstrap and full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is newer territory: report its results without blocking merges.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: "31.1"
      - name: Install Emacs 31.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftpmirror.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip -OutFile emacs.zip
          Expand-Archive emacs.zip -DestinationPath "$env:RUNNER_TEMP\emacs"
          $emacs = Get-ChildItem "$env:RUNNER_TEMP\emacs" -Recurse -Filter emacs.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $emacs.DirectoryName
          # Git's MSYS gpg cannot verify ELPA signatures from native Emacs.
          choco install gnupg -y --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\GnuPG\bin"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: |
            elpa
            var/treesit
          key: ${{ runner.os }}-elpa-${{ hashFiles('lisp/*.el') }}
          restore-keys: ${{ runner.os }}-elpa-
      - name: Install packages and grammars
        run: emacs --batch --load scripts/bootstrap.el --grammars
      - name: Run every test suite
        run: python scripts/test.py
      - name: Check whitespace
        run: git diff --check
