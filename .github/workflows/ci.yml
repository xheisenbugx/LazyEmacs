name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Syntax and startup contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: "31.1"
      - name: Install Emacs 31.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip -OutFile emacs.zip
          Expand-Archive emacs.zip -DestinationPath "$env:RUNNER_TEMP\emacs"
          $emacs = Get-ChildItem "$env:RUNNER_TEMP\emacs" -Recurse -Filter emacs.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $emacs.DirectoryName
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/test.py --offline-only

  integration:
    name: Bootstrap and full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is newer territory: report its results without blocking merges.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: "31.1"
      - name: Install Emacs 31.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip -OutFile emacs.zip
          Expand-Archive emacs.zip -DestinationPath "$env:RUNNER_TEMP\emacs"
          $emacs = Get-ChildItem "$env:RUNNER_TEMP\emacs" -Recurse -Filter emacs.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $emacs.DirectoryName
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: |
            elpa
            var/treesit
          key: ${{ runner.os }}-elpa-${{ hashFiles('lisp/*.el') }}
          restore-keys: ${{ runner.os }}-elpa-
      - name: Install packages and grammars
        if: runner.os != 'Windows'
        run: emacs --batch --load scripts/bootstrap.el --grammars
      # Git for Windows' MSYS gpg cannot verify ELPA signatures from native
      # Emacs, and installing GnuPG on the runner is unreliable.  This
      # disposable CI install skips verification; users install GnuPG
      # (see docs/installation.md).
      - name: Install packages and grammars (Windows)
        if: runner.os == 'Windows'
        run: emacs --batch --eval "(setq package-check-signature nil)" --load scripts/bootstrap.el --grammars
      # Ghostel's terminal is a native module that a user downloads at the
      # first terminal launch; the agent suites need it to start terminals.
      # Loading `ghostel' loads a cached module, so this downloads only once.
      - name: Install the Ghostel terminal module
        if: runner.os != 'Windows'
        run: >-
          emacs -Q --batch
          --eval "(setq package-user-dir (expand-file-name \"elpa\"))"
          --eval "(package-initialize)"
          --eval "(require 'ghostel)"
          --eval "(unless (featurep 'ghostel-module) (ghostel-download-module))"
          --eval "(unless (featurep 'ghostel-module) (error \"Ghostel module did not load\"))"
      - name: Run every test suite
        run: python scripts/test.py
      - name: Check whitespace
        run: git diff --check
